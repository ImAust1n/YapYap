<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpeechForge Widget</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Use Google Fonts for the modern look -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="widget-container" id="widget">
    <div class="header">
      <div class="status-indicator" id="status-indicator"></div>
      <span class="status-text" id="status-text">Press Ctrl+Shift+D to start</span>
    </div>
    
    <div class="content">
      <div id="raw-text" class="raw-text"></div>
      <div id="processed-text" class="processed-text"></div>
    </div>
    
    <div class="footer" id="footer" style="display: none;">
      <div class="latency">
        STT: <span id="lat-stt">0</span>ms | 
        Clean: <span id="lat-clean">0</span>ms | 
        Total: <span id="lat-total">0</span>ms
      </div>
    </div>
  </div>
  
  <script src="renderer.js"></script>
</body>
</html>
